<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- רקע מגילה -->
  <defs>
    <linearGradient id="parchmentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5EED7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8DCBA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D9CCA7;stop-opacity:1" />
    </linearGradient>
    <filter id="parchmentTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  
  <!-- רקע בסיסי -->
  <rect width="800" height="600" fill="#F8F2E2" />
  
  <!-- המגילה -->
  <rect x="50" y="50" width="700" height="500" rx="8" fill="url(#parchmentGradient)" filter="url(#parchmentTexture)" />
  
  <!-- קצוות המגילה -->
  <rect x="65" y="50" width="20" height="500" fill="#D9CCA7" rx="6" />
  <rect x="715" y="50" width="20" height="500" fill="#D9CCA7" rx="6" />
  
  <!-- צבעי מגילה - קווים אופקיים בהירים -->
  <g opacity="0.1">
    <path d="M65,100 L735,100" stroke="#8B4513" stroke-width="1" />
    <path d="M65,150 L735,150" stroke="#8B4513" stroke-width="1" />
    <path d="M65,200 L735,200" stroke="#8B4513" stroke-width="1" />
    <path d="M65,250 L735,250" stroke="#8B4513" stroke-width="1" />
    <path d="M65,300 L735,300" stroke="#8B4513" stroke-width="1" />
    <path d="M65,350 L735,350" stroke="#8B4513" stroke-width="1" />
    <path d="M65,400 L735,400" stroke="#8B4513" stroke-width="1" />
    <path d="M65,450 L735,450" stroke="#8B4513" stroke-width="1" />
    <path d="M65,500 L735,500" stroke="#8B4513" stroke-width="1" />
  </g>
  
  <!-- גוונים בהירים וכהים לדמות קלף ישן -->
  <g opacity="0.15">
    <rect x="150" y="70" width="120" height="70" rx="10" fill="#8B4513" />
    <rect x="350" y="430" width="150" height="90" rx="10" fill="#8B4513" />
    <rect x="580" y="200" width="100" height="60" rx="10" fill="#8B4513" />
    <rect x="120" y="320" width="90" height="50" rx="10" fill="#8B4513" />
  </g>
  
  <!-- אלמנטים עיטוריים -->
  <g fill="#8B4513" opacity="0.2">
    <path d="M400,80 L410,100 L390,100 Z" />
    <path d="M250,520 L260,500 L240,500 Z" />
    <path d="M650,250 L670,260 L670,240 Z" />
    <path d="M150,350 L130,360 L130,340 Z" />
  </g>
  
  <!-- פסים דקורטיביים בצדדים -->
  <g stroke="#8B4513" stroke-width="2" opacity="0.3">
    <path d="M85,60 L85,540" />
    <path d="M95,60 L95,540" />
    <path d="M705,60 L705,540" />
    <path d="M695,60 L695,540" />
  </g>
</svg>