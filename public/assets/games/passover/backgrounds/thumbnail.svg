<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background with gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="sandGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="400" height="300" fill="url(#skyGradient)" />
  
  <!-- Stars -->
  <g fill="#FEF3C7" fill-opacity="0.7">
    <circle cx="50" cy="50" r="1.5" />
    <circle cx="100" cy="30" r="1" />
    <circle cx="150" cy="70" r="1.5" />
    <circle cx="200" cy="40" r="1" />
    <circle cx="250" cy="60" r="1.5" />
    <circle cx="300" cy="35" r="1" />
    <circle cx="350" cy="55" r="2" />
    <circle cx="75" cy="85" r="1" />
    <circle cx="125" cy="65" r="1.5" />
    <circle cx="175" cy="25" r="1" />
    <circle cx="225" cy="75" r="1.5" />
    <circle cx="275" cy="25" r="1" />
    <circle cx="325" cy="80" r="1.5" />
    <circle cx="375" cy="30" r="1" />
  </g>
  
  <!-- Moon -->
  <circle cx="60" cy="60" r="25" fill="#FEF3C7" fill-opacity="0.8" />
  <circle cx="68" cy="52" r="8" fill="#1E3A8A" fill-opacity="0.3" />
  
  <!-- Pyramids -->
  <polygon points="140,200 220,120 300,200" fill="#F59E0B" stroke="#B45309" stroke-width="1" />
  <polygon points="80,200 180,90 280,200" fill="#FBBF24" stroke="#B45309" stroke-width="1" />
  
  <!-- Desert -->
  <rect x="0" y="200" width="400" height="100" fill="url(#sandGradient)" />
  
  <!-- Parting sea -->
  <path d="M0,200 C50,190 100,210 150,190 C200,170 250,190 300,180 C350,170 400,190 400,200 L400,300 L0,300 Z" fill="url(#waterGradient)" />
  <path d="M150,190 L150,300 L250,300 L250,180 Z" fill="#E0E7FF" fill-opacity="0.3" />
  
  <!-- Title -->
  <g transform="translate(200, 250)" text-anchor="middle">
    <text font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" font-weight="bold">המסע לחירות</text>
    <text font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" y="20">משחק פסח אינטראקטיבי</text>
  </g>
</svg>
