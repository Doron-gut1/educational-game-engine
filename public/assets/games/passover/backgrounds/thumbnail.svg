<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- רקע כללי -->
  <rect width="400" height="250" fill="#1a365d" />
  
  <!-- פירמידות -->
  <polygon points="80,190 150,100 220,190" fill="#e9c46a" />
  <polygon points="180,190 250,120 320,190" fill="#d4af37" />
  <polygon points="120,190 210,150 300,190" fill="#c89932" />
  
  <!-- קווים דקורטיביים -->
  <rect x="0" y="190" width="400" height="60" fill="#e9c46a" />
  <rect x="0" y="190" width="400" height="10" fill="#c89932" />
  <rect x="0" y="200" width="400" height="5" fill="#d4af37" />
  
  <!-- ירח -->
  <circle cx="300" cy="50" r="30" fill="#e9d8a6" />
  
  <!-- כותרת המשחק -->
  <text x="200" y="230" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a365d">המסע לחירות</text>
  
  <!-- תרגום קטן באנגלית -->
  <text x="200" y="245" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1a365d">Journey to Freedom</text>
</svg>