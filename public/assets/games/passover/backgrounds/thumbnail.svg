<?xml version="1.0" encoding="UTF-8"?>
<svg width="400px" height="250px" viewBox="0 0 400 250" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Passover Game Thumbnail</title>
    <g id="Passover-Thumbnail" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect fill="#14314F" x="0" y="0" width="400" height="250"></rect>
        <!-- Desert Background -->
        <path d="M0,200 C50,180 100,190 150,170 C200,150 250,180 300,170 C350,160 400,180 400,170 L400,250 L0,250 L0,200 Z" id="Desert" fill="#C19A6B"></path>
        <!-- Pyramids -->
        <polygon id="Pyramid1" fill="#FCF5C7" points="50 170 120 80 190 170"></polygon>
        <polygon id="Pyramid2" fill="#E8D6A3" points="150 170 220 110 290 170"></polygon>
        <polygon id="Pyramid3" fill="#D4BF87" points="250 170 320 90 390 170"></polygon>
        <!-- Moon -->
        <circle id="Moon" fill="#FFF5D9" cx="320" cy="60" r="30"></circle>
        <!-- Title -->
        <text id="המסע-לחירות" font-family="Arial-BoldMT, Arial" font-size="36" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            <tspan x="200" y="50">המסע לחירות</tspan>
        </text>
        <text id="Subtitle" font-family="ArialMT, Arial" font-size="20" font-weight="normal" fill="#F8F8F8" text-anchor="middle">
            <tspan x="200" y="80">לומדים על פסח באופן אינטראקטיבי</tspan>
        </text>
        <!-- Decorative Elements -->
        <rect id="Line1" fill="#F59E0B" x="150" y="100" width="100" height="3" rx="1.5"></rect>
        <rect id="Line2" fill="#F59E0B" x="125" y="108" width="150" height="3" rx="1.5"></rect>
    </g>
</svg>