<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dcfce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#86efac;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  
  <!-- Decorative elements -->
  <circle cx="50" cy="40" r="20" fill="#16a34a" opacity="0.3" />
  <circle cx="250" cy="160" r="30" fill="#16a34a" opacity="0.3" />
  
  <!-- Trees -->
  <g transform="translate(80, 100)">
    <!-- Tree trunk -->
    <rect x="-10" y="20" width="20" height="60" fill="#92400e" />
    
    <!-- Tree foliage -->
    <path d="M0,-60 L40,0 L-40,0 Z" fill="#16a34a" />
    <path d="M0,-40 L35,10 L-35,10 Z" fill="#22c55e" />
    <path d="M0,-20 L30,20 L-30,20 Z" fill="#4ade80" />
    
    <!-- Fruits -->
    <circle cx="-20" cy="-20" r="5" fill="#f97316" />
    <circle cx="15" cy="-10" r="4" fill="#f97316" />
    <circle cx="0" cy="-30" r="4" fill="#f97316" />
  </g>
  
  <g transform="translate(200, 110)">
    <!-- Tree trunk -->
    <rect x="-8" y="15" width="16" height="50" fill="#92400e" />
    
    <!-- Tree foliage -->
    <path d="M0,-50 L30,0 L-30,0 Z" fill="#16a34a" />
    <path d="M0,-30 L25,10 L-25,10 Z" fill="#22c55e" />
    <path d="M0,-10 L20,20 L-20,20 Z" fill="#4ade80" />
    
    <!-- Fruits -->
    <circle cx="-15" cy="-15" r="4" fill="#a3e635" />
    <circle cx="12" cy="-8" r="3" fill="#a3e635" />
  </g>
  
  <!-- Title -->
  <g transform="translate(150, 170)">
    <rect x="-120" y="-15" width="240" height="30" rx="15" fill="#166534" opacity="0.8" />
    <text x="0" y="5" fill="white" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">חגיגת ט"ו בשבט</text>
  </g>
</svg>