<?xml version="1.0" encoding="UTF-8"?>
<svg width="200px" height="200px" viewBox="0 0 200 200" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Character Placeholder</title>
    <g id="Character-Placeholder" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <circle id="Background" fill="#4338CA" cx="100" cy="100" r="100"></circle>
        <g id="Person" transform="translate(50.000000, 40.000000)" fill="#F8FAFC">
            <circle id="Head" cx="50" cy="30" r="30"></circle>
            <rect id="Body" x="30" y="70" width="40" height="70" rx="10"></rect>
            <rect id="Arm-Left" transform="translate(15.000000, 90.000000) rotate(-30.000000) translate(-15.000000, -90.000000) " x="5" y="70" width="20" height="40" rx="10"></rect>
            <rect id="Arm-Right" transform="translate(85.000000, 90.000000) scale(-1, 1) rotate(-30.000000) translate(-85.000000, -90.000000) " x="75" y="70" width="20" height="40" rx="10"></rect>
        </g>
        <text id="Character" font-family="Arial-BoldMT, Arial" font-size="16" font-weight="bold" fill="#FFFFFF">
            <tspan x="62" y="160">Character</tspan>
        </text>
    </g>
</svg>