<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple Character Silhouette -->
  <defs>
    <linearGradient id="charGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Light Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="10" ry="10" />
  
  <!-- Character Shape -->
  <g fill="url(#charGradient)">
    <!-- Head -->
    <circle cx="100" cy="80" r="45" />
    
    <!-- Body -->
    <rect x="70" y="125" width="60" height="100" rx="5" ry="5" />
    
    <!-- Arms -->
    <rect x="30" y="125" width="40" height="15" rx="7" ry="7" />
    <rect x="130" y="125" width="40" height="15" rx="7" ry="7" />
    
    <!-- Legs -->
    <rect x="75" y="225" width="20" height="60" rx="5" ry="5" />
    <rect x="105" y="225" width="20" height="60" rx="5" ry="5" />
  </g>
  
  <!-- Hebrew Text Indicating Placeholder -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="16" fill="#4338ca" text-anchor="middle">דמות</text>
</svg>
