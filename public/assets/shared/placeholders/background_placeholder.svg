<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple Gradient Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Main Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <!-- Decorative Pattern -->
  <g fill="#4338ca" fill-opacity="0.05">
    <circle cx="200" cy="150" r="80" />
    <circle cx="600" cy="450" r="100" />
    <circle cx="400" cy="300" r="60" />
  </g>
  
  <!-- Hebrew Text Indicating Placeholder -->
  <text x="400" y="300" font-family="Arial, sans-serif" font-size="24" fill="#4338ca" text-anchor="middle">רקע זמני</text>
</svg>
